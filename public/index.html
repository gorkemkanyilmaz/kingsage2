<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<title>Taht ve Kılıç</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #f5ebd6;
	background-color: #0e0c14;
	overflow: hidden;
	touch-action: none;
	font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(circle at 50% 35%, #1f192d 0%, #0e0c14 75%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 16px;
	visibility: hidden;
	z-index: 10;
}

.boot-title {
	font-size: clamp(24px, 5vw, 40px);
	font-weight: 800;
	letter-spacing: 3px;
	color: #f2cf66;
	text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
}

.boot-sub {
	font-size: clamp(13px, 2.8vw, 16px);
	color: #c8beaa;
	letter-spacing: 1px;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: min(320px, 68vw);
	height: 12px;
	border-radius: 999px;
	accent-color: #e6be53;
	border: 1px solid #6b5426;
	background-color: #191522;
}

#status-progress::-webkit-progress-bar {
	background-color: #191522;
	border-radius: 999px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #b88a2e, #f7d979);
	border-radius: 999px;
}

#status-notice {
	background-color: #4a232e;
	border-radius: 0.65rem;
	border: 1px solid #a8495c;
	color: #f3e8ea;
	line-height: 1.4;
	margin: 0 2rem;
	max-width: 480px;
	overflow: hidden;
	padding: 1rem 1.25rem;
	text-align: center;
	z-index: 11;
}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Tarayıcınız HTML5 canvas desteklemiyor.
		</canvas>

		<noscript>
			Oyunu oynayabilmek için JavaScript gereklidir.
		</noscript>

		<div id="status">
			<div class="boot-title">TAHT VE KILIÇ</div>
			<div class="boot-sub">Diyar hazırlanıyor...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":73041596,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Bilinmeyen bir hata oluştu.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Hata\nTarayıcınızda oyun için gerekli WebGL/WASM özellikleri eksik:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
