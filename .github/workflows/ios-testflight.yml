name: Build & Upload iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight Build Number (e.g. 1, 2, 3, 4, 5, 6)"
        required: true
        default: "26"
      runner:
        description: "GitHub macOS Runner"
        required: true
        type: choice
        default: "macos-26-intel"
        options:
          - macos-26-intel
          - macos-26
          - macos-15-intel
          - macos-14

jobs:
  build-ios-testflight:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2-stable"
      APP_BUNDLE_ID: "com.tahtkilic.kingsage2"
      APPLE_TEAM_ID: "H2TTF8894Z"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Validate App Store Connect Secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Missing required GitHub Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64"
            exit 1
          fi

      - name: Install Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Prepare Apple Signing Certificate & Provisioning Profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" build/ios
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> $GITHUB_ENV

          export ASC_KEY_PATH
          export SIGNING_ENV_FILE="$(pwd)/build/signing.env"
          which fastlane || gem install fastlane --no-document
          fastlane ios prepare_signing 2>&1 | tee fastlane_prepare.log
          cat "$SIGNING_ENV_FILE" >> $GITHUB_ENV

      - name: Inject Profile UUID & Build Number into Godot Export Preset
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "game/export_presets.cfg"
          with open(path, "r", encoding="utf-8") as f:
              txt = f.read()
          uuid = os.environ["ASC_PROFILE_UUID"]
          bnum = os.environ["BUILD_NUMBER"]
          txt = re.sub(r'application/provisioning_profile_uuid_release="[^"]*"', f'application/provisioning_profile_uuid_release="{uuid}"', txt)
          txt = re.sub(r'application/version="[^"]*"', f'application/version="{bnum}"', txt)
          with open(path, "w", encoding="utf-8") as f:
              f.write(txt)
          print(f"Configured export_presets.cfg with UUID={uuid}, build={bnum}")
          PY

      - name: Import Godot Assets & Export iOS Project
        run: |
          python3 - <<'PY'
          import glob, re
          patched = 0
          targets = sorted(glob.glob("game/assets/sprites/village/animated_bg/*.webp.import")) + sorted(glob.glob("game/assets/sprites/map/harita-*.jpg.import"))
          for imp_path in targets:
              with open(imp_path, "r", encoding="utf-8") as f:
                  txt = f.read()
              new_txt = re.sub(r"compress/mode=\d+", "compress/mode=2", txt)
              if new_txt != txt:
                  with open(imp_path, "w", encoding="utf-8") as f:
                      f.write(new_txt)
                  patched += 1
          print(f"Patched {patched} animated_bg + map .import files to VRAM Compressed (ETC2/ASTC) for iOS")
          PY
          "$GODOT_BIN" --headless --path game --import
          set +e
          "$GODOT_BIN" --headless --path game --export-release "iOS" ../build/ios/TahtVeKilic.xcodeproj
          GODOT_RC=$?
          set -e
          echo "Godot export exit code: $GODOT_RC"
          ls -la build/ios/ || true
          if [ ! -f build/ios/TahtVeKilic.xcodeproj/project.pbxproj ]; then
            echo "::error::Godot failed to generate TahtVeKilic.xcodeproj"
            exit 1
          fi
          if ! find build/ios -maxdepth 3 -name "*.pck" | grep -q .; then
            echo "::error::Godot failed to export game .pck"
            exit 1
          fi
          XCODE_PROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "XCODE_PROJ=$(pwd)/$XCODE_PROJ" >> $GITHUB_ENV
          SCHEME=$(xcodebuild -list -json -project "$XCODE_PROJ" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          TARGET=$(xcodebuild -list -json -project "$XCODE_PROJ" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['project']['targets'][0])")
          echo "XCODE_SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "XCODE_TARGET=$TARGET" >> $GITHUB_ENV

      - name: Inject Native iOS Apple ID & Google OAuth Bridge
        run: |
          python3 - <<'PY'
          import os, glob, shutil, re, plistlib

          bridge_src = "tools/ios_native_auth_bridge.mm"
          assert os.path.exists(bridge_src), "Missing tools/ios_native_auth_bridge.mm"

          # 1. Remove pre-built Godot xcarchive/ipa so Step 10 compiles dummy.mm into a fresh archive
          shutil.rmtree("build/ios/TahtVeKilic.xcarchive", ignore_errors=True)
          shutil.rmtree("build/ios/ipa", ignore_errors=True)

          # 2. Merge Godot dummy.cpp symbols (calling tvk_ios_auth_bridge_init()) + Objective-C++ bridge into dummy.mm
          dummies = glob.glob("build/ios/**/dummy.cpp", recursive=True)
          assert dummies, "Could not find dummy.cpp in build/ios"
          with open(bridge_src, "r", encoding="utf-8") as bf:
              bridge_code = bf.read()
          for d in dummies:
              with open(d, "r", encoding="utf-8", errors="replace") as df:
                  orig_dummy = df.read()
              hooked_dummy, hook_n = re.subn(
                  r"(godot_apple_embedded_plugins_initialize\s*\([^)]*\)\s*\{)",
                  r"\1\n\ttvk_ios_auth_bridge_init();",
                  orig_dummy,
                  count=1,
              )
              if hook_n == 0:
                  raise RuntimeError("Could not inject tvk_ios_auth_bridge_init into dummy.cpp:\n" + orig_dummy[:500])
              mm_path = os.path.join(os.path.dirname(d), "dummy.mm")
              with open(mm_path, "w", encoding="utf-8") as mf:
                  mf.write(
                      'extern "C" void tvk_ios_auth_bridge_init(void);\n'
                      + hooked_dummy
                      + "\n\n// --- TVK Native Auth Bridge ---\n"
                      + bridge_code
                  )
              os.remove(d)
              print(f"Merged & hooked {d} + {bridge_src} -> {mm_path} (hooked={hook_n})")

          pbx_list = glob.glob("build/ios/**/*.xcodeproj/project.pbxproj", recursive=True)
          assert pbx_list, "Could not find project.pbxproj"
          for pbx in pbx_list:
              with open(pbx, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              patched_lines = []
              for ln in lines:
                  if "dummy.cpp" in ln:
                      ln = ln.replace("dummy.cpp", "dummy.mm").replace("sourcecode.cpp.cpp", "sourcecode.cpp.objcpp")
                  patched_lines.append(ln)
              txt = "".join(patched_lines)
              txt = re.sub(r"CLANG_ENABLE_OBJC_ARC\s*=\s*NO\s*;", "CLANG_ENABLE_OBJC_ARC = YES;", txt)

              def patch_build_settings(m):
                  block = m.group(0)
                  if "AuthenticationServices" in block:
                      return block
                  if "CLANG_ENABLE_OBJC_ARC" not in block:
                      block = block.replace("buildSettings = {", "buildSettings = {\n\t\t\t\tCLANG_ENABLE_OBJC_ARC = YES;", 1)
                  if "OTHER_LDFLAGS = (" in block:
                      block = block.replace(
                          "OTHER_LDFLAGS = (",
                          'OTHER_LDFLAGS = (\n\t\t\t\t\t"-ObjC",\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tAuthenticationServices,\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tLocalAuthentication,\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tWebKit,\n\t\t\t\t\t"-framework",\n\t\t\t\t\tStoreKit,',
                          1,
                      )
                  else:
                      block = block.replace(
                          "buildSettings = {",
                          'buildSettings = {\n\t\t\t\tOTHER_LDFLAGS = (\n\t\t\t\t\t"$(inherited)",\n\t\t\t\t\t"-ObjC",\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tAuthenticationServices,\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tLocalAuthentication,\n\t\t\t\t\t"-weak_framework",\n\t\t\t\t\tWebKit,\n\t\t\t\t\t"-framework",\n\t\t\t\t\tStoreKit,\n\t\t\t\t);',
                          1,
                      )
                  return block

              txt = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", patch_build_settings, txt, flags=re.S)
              with open(pbx, "w", encoding="utf-8") as f:
                  f.write(txt)
              print(f"Patched {pbx} for Objective-C++ ARC and AuthenticationServices/LocalAuthentication/WebKit/StoreKit")

          # 2. Ensure URL scheme tahtkilic and Face ID usage description exist in Info.plist
          for plist_path in glob.glob("build/ios/**/*Info.plist", recursive=True):
              with open(plist_path, "rb") as f:
                  pl = plistlib.load(f)
              if isinstance(pl, dict):
                  pl.setdefault("NSFaceIDUsageDescription", "Taht ve Kılıç hesabınıza güvenli giriş için Face ID kullanılır.")
                  url_types = pl.setdefault("CFBundleURLTypes", [])
                  has_scheme = any("tahtkilic" in (u.get("CFBundleURLSchemes") or []) for u in url_types if isinstance(u, dict))
                  if not has_scheme:
                      url_types.append({
                          "CFBundleURLName": "com.tahtkilic.kingsage2",
                          "CFBundleURLSchemes": ["tahtkilic"]
                      })
                  with open(plist_path, "wb") as f:
                      plistlib.dump(pl, f)
                  print(f"Updated {plist_path}")

          # 3. Enable Sign In with Apple entitlement only when confirmed in provisioning profile
          apple_signin_ok = os.environ.get("ASC_APPLE_SIGNIN_ENABLED", "0") == "1"
          for ent_path in glob.glob("build/ios/**/*.entitlements", recursive=True):
              with open(ent_path, "rb") as f:
                  ent = plistlib.load(f)
              if isinstance(ent, dict):
                  if apple_signin_ok:
                      ent["com.apple.developer.applesignin"] = ["Default"]
                  elif "com.apple.developer.applesignin" in ent:
                      del ent["com.apple.developer.applesignin"]
                  with open(ent_path, "wb") as f:
                      plistlib.dump(ent, f)
                  print(f"Updated {ent_path} (applesignin={apple_signin_ok})")
          PY

      - name: Export Signed IPA & Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          fastlane ios export_and_upload project_path:"$XCODE_PROJ" scheme:"$XCODE_SCHEME" target:"$XCODE_TARGET" 2>&1 | tee fastlane_upload.log
