name: Upload App Store Creative Assets via ASC API

on:
  push:
    branches:
      - main
    paths:
      - "tools/upload_asc_creative_assets.py"
      - ".github/workflows/asc-upload-creative-assets.yml"
  workflow_dispatch:

jobs:
  upload-creative-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ID: "6835198115"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install PyJWT cryptography requests

      - name: Validate & decode ASC API Key and upload creative assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Missing required GitHub Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64"
            exit 1
          fi
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > /tmp/asc_key.p8
          export ASC_KEY_PATH="/tmp/asc_key.p8"
          python3 tools/upload_asc_creative_assets.py

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/asc_key.p8
